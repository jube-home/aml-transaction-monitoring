global
    maxconn 30000

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s
    timeout retry 1s
    hold valid 10s
    hold other 10s

defaults
    log global
    mode tcp
    retries 3
    timeout connect 4s
    timeout client 30s
    timeout server 30s
    timeout check 10s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

frontend jube_api
    mode http
    # jube-api always listens on 5001 internally (ASPNETCORE_URLS in docker-compose.yml) - 5002 here is only
    # the externally published port.
    bind *:5002
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend jube_api

backend jube_api
    mode http
    balance leastconn
    # Stateless REST API - no session affinity/cookie needed here (contrast with jube_ui's cookie below).
    option redispatch
    retry-on conn-failure
    retries 3
    option httpchk GET /api/ready
    acl server_closing res.hdr(is-closing) -m found
    option http-keep-alive
    http-reuse safe 
    timeout connect 2s
    timeout server 30s
    http-response set-header Connection close if server_closing
    default-server inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
    server-template jube-api- 20 jube-api:5001 check

frontend jube_ui
    mode http
    bind *:5001
    timeout client 120s
    option forwardfor
    http-request set-header X-Forwarded-Proto https 
    default_backend jube_ui

backend jube_ui
    mode http
    balance leastconn
    # jube_ui serves stateful SignalR hub connections (WatcherHub, see Jube.App/Startup.cs's MapHub call) -
    # once a client's connection lands on a jube-ui instance it needs to keep landing there, so session
    # affinity is required here (unlike the stateless jube_api backend above). "dynamic" mode derives each
    # server's cookie value from a hash of its name and dynamic-cookie-key, rather than needing a static
    # value configured per server - necessary since jube-ui's actual servers are resolved at runtime via
    # server-template/DNS (below), not hardcoded. HAProxy itself never resolves the [@HAPROXY_COOKIE_SECRET@]
    # token here - see the haproxy service's command: in docker-compose.yml, which templates in the real
    # secret before HAProxy ever parses this file.
    cookie SRV_ID insert indirect nocache dynamic
    dynamic-cookie-key [@HAPROXY_COOKIE_SECRET@]
    option redispatch
    retries 3
    retry-on conn-failure
    option httpchk GET /api/ready
    option http-keep-alive
    http-reuse safe
    acl server_closing res.hdr(is-closing) -m found
    timeout connect 2s
    timeout server  30s
    timeout tunnel  3600s
    http-response set-header Connection close if server_closing
    default-server inter 3s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
    server-template jube-ui- 20 jube-ui:5001 check

backend postgres_primary
    mode tcp
    # HAProxy decides primary/replica routing by polling each Patroni node's own REST API rather than
    # guessing from a raw TCP check - this is Patroni's own recommended integration pattern, since only
    # Patroni itself reliably knows which node currently holds the lease. GET /primary returns 200 only on
    # the current leader; see postgres_replicas below for the GET /replica counterpart, and both share the
    # "check port 8008" servers below, not 5432 - the health check hits Patroni's REST API, not Postgres
    # itself.
    option httpchk GET /primary
    option srvtcpka
    timeout server 30m
    http-check expect status 200
    # on-marked-down shutdown-sessions: existing sessions on a server are terminated immediately when it's
    # marked down, rather than left to drain, since a demoted primary must stop taking writes at once.
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008
    server patroni4 patroni4:5432 maxconn 100 check port 8008

frontend postgres_rw
    # Dev only - remove this frontend and postgres_ro below in production. Application services on the
    # overlay network reach Postgres via haproxy:5432/haproxy:5433 regardless of whether these are published
    # to the host; the host-published ports here exist only so a developer can connect a client directly.
    mode tcp
    bind *:5432
    option clitcpka
    timeout client 30m
    default_backend postgres_primary

backend postgres_replicas
    mode tcp
    # Same REST-API-poll reasoning as postgres_primary above - GET /replica returns 200 only on nodes Patroni
    # currently considers a healthy standby, never the leader.
    option httpchk GET /replica
    option srvtcpka
    timeout server 30m
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr none
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008
    server patroni4 patroni4:5432 maxconn 100 check port 8008

frontend postgres_ro
    mode tcp
    bind *:5433
    option clitcpka
    timeout client 30m
    default_backend postgres_replicas
