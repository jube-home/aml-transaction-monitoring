bind 0.0.0.0
# Safe specifically *because* requirepass/masterauth are always set below (via each service's own wrapper
# command in docker-compose.yml, sourced from the REDIS_PASSWORD secret) and the network is already confined
# to the private overlay - protected mode exists to stop an accidentally-unauthenticated instance being
# reachable from anywhere, which doesn't apply here since both conditions it guards against are already covered.
protected-mode no
port 6379
# appendfsync everysec (rather than per-write) accepts the same throughput/durability tradeoff as Postgres's
# synchronous_commit "off" in patroni*.yml: an fsync once per second bounds the worst-case data loss on a
# hard crash to roughly one second of writes, in exchange for not paying an fsync's latency on every command.
appendonly yes
appendfsync everysec
# Defaults for this shared template - each service in docker-compose.yml overrides both with its own
# hostname via --replica-announce-ip on the command line, so replicas and Sentinel advertise/see the correct
# per-node address rather than every node claiming to be "redis-master".
replica-announce-ip redis-master
replica-announce-port 6379
# Avoids a further fsync stall while the AOF file is being compacted in the background.
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# Parallelises Redis's normally single-threaded network I/O across threads - worthwhile on the multi-core
# hosts this cluster runs on under concurrent load.
io-threads 4
io-threads-do-reads yes
