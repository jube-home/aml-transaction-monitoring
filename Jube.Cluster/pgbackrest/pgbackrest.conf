[global]
# Mounted from NAS (/mnt/pgbackrest in docker-compose.yml), not host-local disk - durability independence.
# If backups lived on the same host's disk as the Patroni node producing them, losing that host would take
# out the live database *and* its own backup history in the same event. NAS decouples the two, and also
# means any node - not just the one that produced a given backup - can read the repository for a restore.
repo1-path=/var/lib/pgbackrest/repo
# Keep the last two full backups (WAL retained to cover both, see repo1-retention-archive below) - a
# deliberate rollback safety margin: if the newest full backup turns out to be bad, there's still a second,
# older one to fall back to rather than only ever having exactly one.
repo1-retention-full=2
log-level-console=info
log-level-file=detail
lock-path=/var/lib/postgresql/tmp/pgbackrest-lock
log-path=/var/log/pgbackrest
# Mounted as tmpfs in docker-compose.yml (RAM-backed, non-persistent) - paired with archive-async below.
spool-path=/var/spool/pgbackrest
start-fast=y
# Decouples Postgres's archive_command from actual NAS write latency: Postgres hands a completed WAL segment
# to the fast local spool above and moves on immediately, while a background pgBackRest process drains that
# spool to the NAS repository asynchronously. A slow or momentarily congested NAS write can never stall the
# primary's own WAL archiving as a result - the spool being non-durable is fine precisely because the durable
# copy of record is whatever has already landed in the NAS repository, not whatever's transiently in the spool.
archive-async=y
repo1-retention-archive=2
repo1-retention-archive-type=full
repo1-retention-full-type=count
process-max=4
archive-timeout=60
archive-push-queue-max=10GB

[postgres-cluster]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
