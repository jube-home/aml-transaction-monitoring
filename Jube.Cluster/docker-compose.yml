    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_3
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 120s
  
  etcd4:
    hostname: etcd4
    image: quay.io/coreos/etcd:v3.5.3
