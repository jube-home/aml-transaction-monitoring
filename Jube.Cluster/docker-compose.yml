        window: 120s
  
  redis-replica3:
    image: redis:7-alpine
    hostname: redis-replica3
    secrets:
      - REDIS_PASSWORD
    command:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/REDIS_PASSWORD)
        MASTER_HOST=""
