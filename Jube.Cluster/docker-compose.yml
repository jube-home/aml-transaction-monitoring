        exec redis-server /redis.conf \
          --replicaof "$$MASTER_HOST" 6379 \
          --requirepass "$$PASS" \
          --masterauth "$$PASS" \
          --protected-mode no \
          --replica-announce-ip redis-replica3
    volumes:
      - redis-replica3-data:/data
      - ./redis/redis.conf:/redis.conf:ro
    networks:
      jube-cluster:
        aliases:
          - redis-replica3
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_4
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
        window: 120s
  
  sentinel1:
    image: redis:7-alpine
    hostname: sentinel1
    # Five Sentinels, deliberately odd for the same quorum/majority-vote reasoning as etcd's five nodes (see
    # etcd1 above) - avoids a tied vote during a partition when deciding whether to fail over redis-master.
    secrets:
      - REDIS_PASSWORD
    command:
      - sh
      - -c
      - |
        REDIS_PASS=$$(cat /run/secrets/REDIS_PASSWORD)
        cp /etc/sentinel-template/sentinel.conf /tmp/sentinel.conf
        sed -i "s/__REDIS_PASSWORD__/$$REDIS_PASS/g" /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./redis/sentinel1:/etc/sentinel-template:ro
    networks:
      jube-cluster:
        aliases:
          - sentinel1
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 180s

  sentinel2:
    image: redis:7-alpine
    hostname: sentinel2
    secrets:
