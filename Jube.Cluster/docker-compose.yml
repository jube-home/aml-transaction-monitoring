      - ./redis/redis.conf:/redis.conf:ro
    networks:
      jube-cluster:
        aliases:
          - redis-replica2
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_3
      restart_policy:
