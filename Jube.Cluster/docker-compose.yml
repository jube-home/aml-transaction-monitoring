        max_attempts: 5
        window: 180s

  sentinel5:
    image: redis:7-alpine
    hostname: sentinel5
    secrets:
      - REDIS_PASSWORD
    command:
      - sh
      - -c
      - |
        REDIS_PASS=$$(cat /run/secrets/REDIS_PASSWORD)
        cp /etc/sentinel-template/sentinel.conf /tmp/sentinel.conf
        sed -i "s/__REDIS_PASSWORD__/$$REDIS_PASS/g" /tmp/sentinel.conf
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./redis/sentinel5:/etc/sentinel-template:ro
    networks:
      jube-cluster:
        aliases:
          - sentinel5
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_TIEBREAKER
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 5
        window: 180s
        
  jube-ui:
    image: ${JUBE_IMAGE}
    secrets:
      - JUBE_APP_PASSWORD
      - JUBE_REPORTING_PASSWORD
      - JUBE_MIGRATION_PASSWORD
      - JWT_KEY
      - PASSWORD_HASHING_KEY
      - REDIS_PASSWORD
      - API_HMAC_KEY
      - PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      # Port 5433, not 5432 - HAProxy's postgres_replicas backend (see haproxy.cfg), routing reporting/read
      # queries to a Patroni replica instead of the primary.
      - ReportConnectionString=Host=haproxy;Port=5433;Database=postgres;Username=jube_reporting;Password=[@JUBE_REPORTING_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - EnableSandbox=False
      - JWTKey=[@JWT_KEY@]
      - ApiHmacKey=[@API_HMAC_KEY@]
      - PasswordAsymmetricEncryption=True
      - PasswordAsymmetricEncryptionPrivateKey=[@PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY@]
      # Only the private key flows through Docker secrets/[@Key@] tokenisation like the values above - the
      # public key isn't sensitive, so secrets-init.sh just prints it once for a manual paste here instead
      # of provisioning a secret for it. Required whenever PasswordAsymmetricEncryption=True: Jube refuses
      # to start with RSA password encryption enabled and either key missing.
      - PasswordAsymmetricEncryptionPublicKey=CHANGE-ME-paste-public-key-printed-by-secrets-init.sh
      - RedisConnectionString=sentinel1:26379,sentinel2:26379,sentinel3:26379,sentinel4:26379,sentinel5:26379,serviceName=redis-master,password=[@REDIS_PASSWORD@],abortConnect=false,syncTimeout=8000,responseTimeout=8000,connectTimeout=10000,keepAlive=60
      - EnableExhaustiveTraining=False
      - Landlord=False
      - EnableReprocessing=False
      - EnableSanctionLoader=False
      - CachePruneServer=False
      - EnableTtlCounter=False
      - EnableSearchKeyCache=False
      - EnableCasesAutomation=False
      - PasswordHashingKey=[@PASSWORD_HASHING_KEY@]
      - EnableMigration=False
      # jube-ui never runs the rules engine or entity model - it's the presentation layer only, so unlike
      # jube-api/jube-jobs below it also has no ElementSymmetricEncryptionKey secret/env var: that key only
      # matters to Inline Scripts' AES helper, which can only ever run where EnableEngine/EnableEntityModel is
      # True.
      - EnableEngine=False
      - EnableEntityModel=False
      - LocalCache=False
      - LocalCacheBytes=0
      - LocalCacheFill=False
      - RedisPublishSubscribeEvents=False
      - RedisBackplane=True
      - EnablePublicInvokeController=False
      - Log4NetLogLevel=INFO
      - DOTNET_GC_SERVER=1
      - SecretsPath=/run/secrets/
      - NegotiateAuthentication=False
      - KRB5_CONFIG=/etc/krb5.conf
      - KRB5_KTNAME=FILE:/etc/krb5.keytab
      - KRB5RCACHETYPE=none
      # Uncomment for Kerberos/GSSAPI diagnostics during go-live. Writes the full
      # negotiation (keytab selection, KDC traffic, enctypes) to stderr, which lands
      # in `docker service logs`. Verbose and logs principal names - disable after.
      # - KRB5_TRACE=/dev/stderr
      - JWTValidIssuer=https://CHANGE-ME.yourcorp.com
      - JWTValidAudience=https://CHANGE-ME.yourcorp.com
    networks:
      jube-cluster:
        aliases:
          - jube-ui
    volumes:
      - ./krb5/krb5.conf:/etc/krb5.conf:ro
      - ./krb5/jube.keytab:/etc/krb5.keytab:ro
    deploy:
#      placement:
#        max_replicas_per_node: 1
#        constraints:
#          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      # replicas: 0 here (and on jube-api) deliberately - both are scaled up manually only after jube-jobs has
      # run its database migration (EnableMigration=True there, see jube-jobs below), so a fresh deployment
      # can never race the application tier against an unmigrated schema.
      replicas: 0
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 120s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        failure_action: continue
  
  jube-api:
    image: ${JUBE_IMAGE}
    secrets:
      - JUBE_APP_PASSWORD
      - JUBE_REPORTING_PASSWORD
      - JUBE_MIGRATION_PASSWORD
      - JWT_KEY
      - PASSWORD_HASHING_KEY
      - REDIS_PASSWORD
      - API_HMAC_KEY
      - ENCRYPTION_KEY
      - PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      # Port 5433, not 5432 - HAProxy's postgres_replicas backend (see haproxy.cfg), routing reporting/read
      # queries to a Patroni replica instead of the primary.
      - ReportConnectionString=Host=haproxy;Port=5433;Database=postgres;Username=jube_reporting;Password=[@JUBE_REPORTING_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - EnableSandbox=False
      - JWTKey=[@JWT_KEY@]
      - ApiHmacKey=[@API_HMAC_KEY@]
      - ElementSymmetricEncryptionKey=[@ENCRYPTION_KEY@]
      - PasswordAsymmetricEncryption=True
      - PasswordAsymmetricEncryptionPrivateKey=[@PASSWORD_ASYMMETRIC_ENCRYPTION_PRIVATE_KEY@]
      # Only the private key flows through Docker secrets/[@Key@] tokenisation like the values above - the
      # public key isn't sensitive, so secrets-init.sh just prints it once for a manual paste here instead
      # of provisioning a secret for it. Required whenever PasswordAsymmetricEncryption=True: Jube refuses
      # to start with RSA password encryption enabled and either key missing.
      - PasswordAsymmetricEncryptionPublicKey=CHANGE-ME-paste-public-key-printed-by-secrets-init.sh
      - RedisConnectionString=sentinel1:26379,sentinel2:26379,sentinel3:26379,sentinel4:26379,sentinel5:26379,serviceName=redis-master,password=[@REDIS_PASSWORD@],abortConnect=false,syncTimeout=8000,responseTimeout=8000,connectTimeout=10000,keepAlive=60
      - EnableExhaustiveTraining=False
      - Landlord=True
      - EnableReprocessing=False
      - EnableSanctionLoader=False
      - CachePruneServer=False
      - EnableTtlCounter=False
      - EnableSearchKeyCache=False
      - EnableCasesAutomation=False
      - PasswordHashingKey=[@PASSWORD_HASHING_KEY@]
      - EnableMigration=False
      - EnableEngine=True
      - LocalCache=True
      - LocalCacheBytes=4294967296
      - LocalCacheFill=False
      - RedisPublishSubscribeEvents=True
      - EnableEntityModel=True
      - EnablePublicInvokeController=True
      - Log4NetLogLevel=WARN
      - ActivationWatcherBulkCopyThresholdjube-=20
      - ArchiverPersistThreads=4
      - BulkCopyThreshold=20
      - DOTNET_GC_SERVER=1
      - SecretsPath=/run/secrets/
      - NegotiateAuthentication=False
      - KRB5_CONFIG=/etc/krb5.conf
      - KRB5_KTNAME=FILE:/etc/krb5.keytab
      - KRB5RCACHETYPE=none
      # Uncomment for Kerberos/GSSAPI diagnostics during go-live. Writes the full
      # negotiation (keytab selection, KDC traffic, enctypes) to stderr, which lands
      # in `docker service logs`. Verbose and logs principal names - disable after.
      # - KRB5_TRACE=/dev/stderr
      - JWTValidIssuer=https://CHANGE-ME.yourcorp.com
      - JWTValidAudience=https://CHANGE-ME.yourcorp.com
    networks:
      jube-cluster:
        aliases:
          - jube-api
    volumes:
      - ./krb5/krb5.conf:/etc/krb5.conf:ro
      - ./krb5/jube.keytab:/etc/krb5.keytab:ro
    deploy:
#      placement:
#        max_replicas_per_node: 1
#        constraints:
#          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      # Same replicas: 0 / manual-scale-up-after-migration reasoning as jube-ui above.
      replicas: 0
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 120s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        monitor: 30s
        failure_action: continue

  jube-jobs:
    image: ${JUBE_IMAGE}
    secrets:
      - JUBE_APP_PASSWORD
      - JUBE_REPORTING_PASSWORD
      - JUBE_MIGRATION_PASSWORD
      - JWT_KEY
      - PASSWORD_HASHING_KEY
      - REDIS_PASSWORD
      - ENCRYPTION_KEY
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_app;Password=[@JUBE_APP_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - ReportConnectionString=Host=haproxy;Port=5433;Database=postgres;Username=jube_reporting;Password=[@JUBE_REPORTING_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - MigrationConnectionString=Host=haproxy;Port=5432;Database=postgres;Username=jube_migration;Password=[@JUBE_MIGRATION_PASSWORD@];Pooling=true;Minimum Pool Size=0;Maximum Pool Size=1000;No Reset On Close=true;Keepalive=60;Connection Idle Lifetime=300;Connection Pruning Interval=10;
      - RedisConnectionString=sentinel1:26379,sentinel2:26379,sentinel3:26379,sentinel4:26379,sentinel5:26379,serviceName=redis-master,password=[@REDIS_PASSWORD@],abortConnect=false,syncTimeout=8000,responseTimeout=8000,connectTimeout=10000,keepAlive=60
      - JWTKey=[@JWT_KEY@]
      - ElementSymmetricEncryptionKey=[@ENCRYPTION_KEY@]
      # jube-jobs is the only service with these background-processing flags (plus EnableMigration below) set
      # True - jube-api/jube-ui have every one of them False. Several are documented as safe to run on only
      # one instance at a time; letting every scaled jube-api/jube-ui replica also run them would mean N
      # copies of the same job racing each other. jube-jobs is deployed as a singleton for exactly this reason
      # (replicas: 0 below, scaled to exactly 1 manually) - jube-api/jube-ui are the stateless,
      # horizontally-scaled request handlers.
      - EnableExhaustiveTraining=True
      - EnableReprocessing=True
      - EnableSanctionLoader=True
      - CachePruneServer=True
      - EnableTtlCounter=True
      - EnableSearchKeyCache=True
      - EnableCasesAutomation=True
      - StreamingActivationWatcher=False
      - EnableCallback=True
      - PasswordHashingKey=[@PASSWORD_HASHING_KEY@]
      - EnableMigration=True
      - EnableEngine=True
      - EnableEntityModel=True
      - EnablePublicInvokeController=False
      - LocalCache=False
      - LocalCacheBytes=0
      - LocalCacheFill=False
      - RedisPublishSubscribeEvents=False
      - Log4NetLogLevel=INFO
      - DOTNET_GC_SERVER=1
      - SecretsPath=/run/secrets/
    networks:
      jube-cluster:
        aliases:
          - jube-jobs
    deploy:
#      placement:
#        constraints:
#          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      replicas: 0
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        parallelism: 1
        delay: 180s
        order: stop-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 1
        delay: 60s
        order: stop-first
        failure_action: continue

  dozzle:
    image: amir20/dozzle:latest
    # Dozzle's own login, on top of the network-layer restriction on this port (see the deployment doc's Port
    # Map) - defense in depth, since its log viewer can surface anything an application logs. Generate real
    # credentials before deploying (`docker run --rm amir20/dozzle generate <user> --password <pass> --name
    # "<name>"`) and replace ./dozzle/users.yml with the output - the committed template is intentionally not
    # a working credential file.
    command:
      - --auth-provider
      - simple
    environment:
      - DOZZLE_MODE=swarm
    volumes:
      # Docker socket access is powerful regardless of the read-only bind-mount flag - a process with socket
      # access can still start/stop/inspect containers via the Docker API. This is what Dozzle needs to
      # introspect the cluster, and the standard mechanism for this class of tool, but it's a real trust
      # decision, not a fully contained one.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/users.yml:/data/users.yml:ro
    ports:
      - "8080:8080"
    networks:
      jube-cluster:
        aliases:
          - dozzle
    deploy:
      # One Dozzle instance per manager node (not a fixed replica count) - paired with DOZZLE_MODE=swarm,
      # each instance discovers and aggregates logs from every task across the whole Swarm, not just
      # containers local to its own node. This is what the internal-only agent port 7007 is for
      # (agent-to-UI communication between instances) - Dozzle's documented pattern for Swarm log
      # aggregation, rather than something specific to this cluster.
      mode: global
      restart_policy:
        condition: on-failure
        delay: 30s
      placement:
        constraints:
          - node.role == manager

  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - kuma_data:/app/data
      # Same docker.sock trust note as dozzle above.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3001:3001"
    networks:
      jube-cluster:
        aliases:
          - uptime-kuma
    deploy:
      restart_policy:
        condition: on-failure
        delay: 30s
      # Pinned to exactly one replica (not scaled or global) because Uptime Kuma keeps its state in a local
      # SQLite database, which can't be shared across replicas - more than one would mean two independent,
      # diverging monitors. Paired with the manager-only placement constraint below so an unpinned single
      # replica can't get rescheduled onto a node without its data volume.
      replicas: 1
      placement:
        constraints:
          - node.role == manager

