      - ./patroni/patroni3.yml:/etc/patroni.yml:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /mnt/pgbackrest:/var/lib/pgbackrest
      - patroni3_runtime:/var/run/postgresql
      - patroni3_tmp:/var/lib/postgresql/tmp
    tmpfs:
