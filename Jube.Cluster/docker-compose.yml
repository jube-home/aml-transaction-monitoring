services:
  etcd1:
    hostname: etcd1
    image: quay.io/coreos/etcd:v3.5.3
    environment:
      - ETCDCTL_API=3
    # etcd is Patroni's consensus/leader-election store. Five nodes, deliberately odd (see the
    # CRITICAL_HOST_TIEBREAKER zone on etcd5 below) - etcd is a quorum/majority-vote system, and an odd node
    # count avoids the tied vote a same-sized even count can produce during a network partition.
    command: >
      etcd
      -name etcd1
      -data-dir /etcd-data
      -advertise-client-urls http://etcd1:2379
      -listen-client-urls http://0.0.0.0:2379
      -listen-peer-urls http://0.0.0.0:2380
      -initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380,etcd4=http://etcd4:2380,etcd5=http://etcd5:2380
      -initial-cluster-token etcd-cluster
      -initial-advertise-peer-urls http://etcd1:2380
      -initial-cluster-state new
    volumes:
      - etcd1_data:/etcd-data
    networks:
      jube-cluster:
        aliases:
          - etcd1
    deploy:
      # dnsrr (not Swarm's default VIP load balancing) gives each replica its own resolvable DNS name -
      # required since etcd/Patroni/Sentinel all need to address specific named peers directly (e.g. etcd's
      # own -initial-cluster list above), not "any node" via a load-balanced virtual IP.
      endpoint_mode: dnsrr
      placement:
        constraints:
          # Pins this service to a specific host (zone) rather than letting Swarm reschedule it onto whichever
          # node has capacity - unpinned, that would defeat the zone-per-node fault-isolation design this
          # cluster relies on. CRITICAL_HOST_1 also hosts patroni1/redis-master/sentinel1 below - one full
          # stack replica per physical zone.
          - node.labels.zone == $CRITICAL_HOST_1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 120s

  etcd2:
    hostname: etcd2
    image: quay.io/coreos/etcd:v3.5.3
    environment:
      - ETCDCTL_API=3
    command: >
      etcd
      -name etcd2
      -data-dir /etcd-data
      -advertise-client-urls http://etcd2:2379
      -listen-client-urls http://0.0.0.0:2379
      -listen-peer-urls http://0.0.0.0:2380
      -initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380,etcd4=http://etcd4:2380,etcd5=http://etcd5:2380
      -initial-cluster-token etcd-cluster
      -initial-advertise-peer-urls http://etcd2:2380
      -initial-cluster-state new
    volumes:
      - etcd2_data:/etcd-data
    networks:
      jube-cluster:
        aliases:
          - etcd2
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_2
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 120s

  etcd3:
    hostname: etcd3
    image: quay.io/coreos/etcd:v3.5.3
    environment:
      - ETCDCTL_API=3
    command: >
      etcd
      -name etcd3
      -data-dir /etcd-data
      -advertise-client-urls http://etcd3:2379
      -listen-client-urls http://0.0.0.0:2379
      -listen-peer-urls http://0.0.0.0:2380
      -initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380,etcd4=http://etcd4:2380,etcd5=http://etcd5:2380
      -initial-cluster-token etcd-cluster
      -initial-advertise-peer-urls http://etcd3:2380
      -initial-cluster-state new
    volumes:
      - etcd3_data:/etcd-data
    networks:
      jube-cluster:
