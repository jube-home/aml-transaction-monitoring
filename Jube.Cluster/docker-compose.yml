    networks:
      jube-cluster:
        aliases:
          - etcd5
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_TIEBREAKER
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
        window: 120s

  patroni1:
    image: ${PATRONI_IMAGE}
    secrets:
      - PATRONI_REPLICATION_PASSWORD
      - PATRONI_SUPERUSER_PASSWORD
      - PATRONI_ADMIN_PASSWORD
    env_file:
      - .env
    hostname: patroni1
    environment:
      - PATRONI_CONFIG_FILE=/etc/patroni.yml
      - PATRONI_NAME=patroni1
      - PATRONI_SCOPE=postgres-cluster
      - PATRONI_ETCD3_HOSTS=etcd1:2379,etcd2:2379,etcd3:2379,etcd4:2379,etcd5:2379
    volumes:
      - patroni1_data:/var/lib/postgresql/data
      - ./patroni/patroni1.yml:/etc/patroni.yml:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /mnt/pgbackrest:/var/lib/pgbackrest
      - patroni1_runtime:/var/run/postgresql
      - patroni1_tmp:/var/lib/postgresql/tmp
    tmpfs:
      - /var/spool/pgbackrest
    networks:
      jube-cluster:
        aliases:
          - patroni1
    deploy:
      # Same dnsrr/zone-pinning reasoning as etcd1 above.
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_1
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 10
        window: 3600s

  patroni2:
    image: ${PATRONI_IMAGE}
    secrets:
      - PATRONI_REPLICATION_PASSWORD
      - PATRONI_SUPERUSER_PASSWORD
      - PATRONI_ADMIN_PASSWORD
    env_file:
      - .env
    hostname: patroni2
    environment:
      - PATRONI_CONFIG_FILE=/etc/patroni.yml
      - PATRONI_NAME=patroni2
      - PATRONI_SCOPE=postgres-cluster
      - PATRONI_ETCD3_HOSTS=etcd1:2379,etcd2:2379,etcd3:2379,etcd4:2379,etcd5:2379
    volumes:
      - patroni2_data:/var/lib/postgresql/data
      - ./patroni/patroni2.yml:/etc/patroni.yml:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - /mnt/pgbackrest:/var/lib/pgbackrest
      - patroni2_runtime:/var/run/postgresql
      - patroni2_tmp:/var/lib/postgresql/tmp
    tmpfs:
      - /var/spool/pgbackrest
    networks:
      jube-cluster:
        aliases:
          - patroni2
    deploy:
      endpoint_mode: dnsrr
