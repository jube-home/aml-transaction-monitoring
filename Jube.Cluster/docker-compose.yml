        constraints:
          - node.labels.zone == $CRITICAL_HOST_4
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 10
        window: 3600s
  
  haproxy:
    hostname: haproxy
    image: haproxy:2.8
    secrets:
      - HAPROXY_COOKIE_SECRET
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.tpl:ro
    # haproxy.cfg's dynamic-cookie-key has no file-reading support of its own (verified against the real
    # haproxy:2.8 image - it takes a single literal argument), so the Docker secret has to be templated into
    # the config before haproxy parses it. This substitutes the [@HAPROXY_COOKIE_SECRET@] token - the same
    # [@Key@] convention Jube's own DynamicEnvironment tokenisation uses - with the mounted secret's contents
    # into a writable copy, then hands off to haproxy the same way the image's own entrypoint would (-W -db,
    # matching docker-entrypoint.sh's behaviour for a bare "haproxy" command).
    command: ["sh", "-c", "sed \"s#\\[@HAPROXY_COOKIE_SECRET@\\]#$(cat /run/secrets/HAPROXY_COOKIE_SECRET)#\" /usr/local/etc/haproxy/haproxy.cfg.tpl > /tmp/haproxy.cfg && exec haproxy -W -db -f /tmp/haproxy.cfg"]
    ports:
      - target: 7000
        published: 7000
        protocol: tcp
        mode: host
      - target: 5002
        published: 5002
        protocol: tcp
        mode: host
      - target: 5001
        published: 5001
        protocol: tcp
        mode: host
    networks:
      jube-cluster:
        aliases:
          - haproxy
    deploy:
#      placement:
#        constraints:
#          - node.labels.zone != $CRITICAL_HOST_TIEBREAKER
      mode: global
      restart_policy:
        condition: on-failure
        delay: 15s
  
  redis-master:
    image: redis:7-alpine
    hostname: redis-master
    secrets:
      - REDIS_PASSWORD
    # Every node defers to Sentinel on startup rather than hardcoding itself as master: this queries each
    # Sentinel in turn for who it currently considers master, and only falls back to the static topology below
    # (this node seeds as a plain master) if no Sentinel can be reached or has an opinion yet - true only on a
    # genuinely fresh cluster. This matters because a container restart (crash, redeploy, `service update
    # --force`) always re-runs this script: without querying Sentinel first, a node Sentinel already failed
    # away from could restart and declare itself master again with its own old data - a second, independent
    # master directly contradicting what the rest of the cluster now agrees is authoritative.
    command:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/REDIS_PASSWORD)
        MASTER_HOST=""
        for S in sentinel1 sentinel2 sentinel3 sentinel4 sentinel5; do
          MASTER_HOST=$$(redis-cli -h "$$S" -p 26379 --connect-timeout 2 SENTINEL get-master-addr-by-name redis-master 2>/dev/null | sed -n 1p)
          [ -n "$$MASTER_HOST" ] && break
        done
        if [ -n "$$MASTER_HOST" ] && [ "$$MASTER_HOST" != "redis-master" ]; then
          exec redis-server /redis.conf \
            --requirepass "$$PASS" \
            --masterauth "$$PASS" \
            --replicaof "$$MASTER_HOST" 6379 \
            --replica-announce-ip redis-master
        else
          exec redis-server /redis.conf \
            --requirepass "$$PASS" \
            --masterauth "$$PASS" \
            --replica-announce-ip redis-master
        fi
    volumes:
      # NAS-backed, unlike the three replicas' local Swarm-managed volumes below - a backup decision, not a
      # role/failover one now that startup role is Sentinel-driven for all four (see command above). This is a
      # further, independent layer of backup beyond in-cluster replica redundancy - the same durability-
      # independence reasoning as pgBackRest's repository, applied to Redis. The replicas deliberately don't
      # need this: any one of them can always fully re-sync from whichever node Sentinel currently considers
      # master, so paying NAS latency for volumes that exist to be disposable and rebuildable would be pure
      # overhead with no corresponding benefit.
      - /mnt/redis:/data
      - ./redis/redis.conf:/redis.conf:ro
    networks:
      jube-cluster:
        aliases:
          - redis-master
    deploy:
      # Same dnsrr/zone-pinning reasoning as etcd1 above.
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_1
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
        window: 120s
  
  redis-replica1:
    image: redis:7-alpine
    hostname: redis-replica1
    secrets:
      - REDIS_PASSWORD
    # Same Sentinel-first startup logic as redis-master above, minus the plain-master fallback branch - this
    # node always ends up as a replica of whoever Sentinel currently considers master.
    command:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/REDIS_PASSWORD)
        MASTER_HOST=""
        for S in sentinel1 sentinel2 sentinel3 sentinel4 sentinel5; do
          MASTER_HOST=$$(redis-cli -h "$$S" -p 26379 --connect-timeout 2 SENTINEL get-master-addr-by-name redis-master 2>/dev/null | sed -n 1p)
          [ -n "$$MASTER_HOST" ] && break
        done
        [ -z "$$MASTER_HOST" ] && MASTER_HOST=redis-master
        exec redis-server /redis.conf \
          --replicaof "$$MASTER_HOST" 6379 \
          --requirepass "$$PASS" \
          --masterauth "$$PASS" \
          --protected-mode no \
          --replica-announce-ip redis-replica1
    volumes:
      # Local, Swarm-managed volume (not NAS) - see redis-master's volumes comment above for why.
      - redis-replica1-data:/data
      - ./redis/redis.conf:/redis.conf:ro
    networks:
      jube-cluster:
        aliases:
          - redis-replica1
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.zone == $CRITICAL_HOST_2
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 10
        window: 120s
  
  redis-replica2:
    image: redis:7-alpine
    hostname: redis-replica2
    secrets:
      - REDIS_PASSWORD
    command:
      - sh
      - -c
      - |
        PASS=$$(cat /run/secrets/REDIS_PASSWORD)
        MASTER_HOST=""
        for S in sentinel1 sentinel2 sentinel3 sentinel4 sentinel5; do
          MASTER_HOST=$$(redis-cli -h "$$S" -p 26379 --connect-timeout 2 SENTINEL get-master-addr-by-name redis-master 2>/dev/null | sed -n 1p)
          [ -n "$$MASTER_HOST" ] && break
        done
        [ -z "$$MASTER_HOST" ] && MASTER_HOST=redis-master
        exec redis-server /redis.conf \
          --replicaof "$$MASTER_HOST" 6379 \
